  <g class="c1"><rect x="700" y="395" width="260" height="30" rx="8" fill="#22d3ee1f" stroke="#22d3ee66"/><text x="830" y="415" fill="#a5f3fc" text-anchor="middle">llamada: clima("Santiago")</text></g>
