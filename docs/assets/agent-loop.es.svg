<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="980" height="470" viewBox="0 0 980 470" role="img" aria-label="El bucle del agente: llama al modelo → ejecuta herramientas → repite hasta terminar">
<defs>
