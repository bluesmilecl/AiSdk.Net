name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'   # pruebas en vivo diarias contra las APIs reales (rama por defecto)

# GITHUB_TOKEN solo lectura; los jobs que necesitan más lo piden explícitamente.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # Acciones fijadas por hash de commit (las etiquetas se pueden mover); Dependabot las actualiza.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: OCR, PDF and video tools (AiSdk.Documents tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa poppler-utils ffmpeg
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Unit tests
        run: dotnet test tests/AiSdk.Tests --no-build -c Release --verbosity normal
      # Las claves de los proveedores solo llegan a las pruebas en la rama principal (push, programadas o manuales):
      # un push a cualquier otra rama no puede leerlas modificando las pruebas. Sin clave, las pruebas en vivo se omiten.
      - name: Integration tests (live tests only on the default branch)
        run: dotnet test tests/AiSdk.IntegrationTests --no-build -c Release --verbosity normal
        env:
          ANTHROPIC_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.OPENAI_API_KEY || '' }}
          GEMINI_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.GEMINI_API_KEY || '' }}
          MISTRAL_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.MISTRAL_API_KEY || '' }}
          COHERE_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.COHERE_API_KEY || '' }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.AWS_BEARER_TOKEN_BEDROCK || '' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AISDK_TEST_BEDROCK_MODEL: ${{ vars.AISDK_TEST_BEDROCK_MODEL }}
          AISDK_TEST_OPENAI_MODEL: ${{ vars.AISDK_TEST_OPENAI_MODEL }}
          AISDK_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
      - run: dotnet pack AiSdk.slnx -c Release -o artifacts --no-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*
