name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: OCR, PDF and video tools (AiSdk.Documents tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa poppler-utils ffmpeg
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Unit tests
        run: dotnet test tests/AiSdk.Tests --no-build -c Release --verbosity normal
      - name: Integration tests (skipped when the API key is not configured)
        run: dotnet test tests/AiSdk.IntegrationTests --no-build -c Release --verbosity normal
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AISDK_TEST_BEDROCK_MODEL: ${{ vars.AISDK_TEST_BEDROCK_MODEL }}
          AISDK_TEST_OPENAI_MODEL: ${{ vars.AISDK_TEST_OPENAI_MODEL }}
          AISDK_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
      - run: dotnet pack AiSdk.slnx -c Release -o artifacts --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
