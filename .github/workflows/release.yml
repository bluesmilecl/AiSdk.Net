name: Release

# Publica en nuget.org al crear un tag vX.Y.Z (p. ej. v0.2.0) usando trusted publishing (OIDC):
# no hay API keys de larga duración; NuGet/login obtiene un token temporal para este workflow.
#
# Configuración única (ver docs/quality/nuget-trusted-publishing.md):
#   1. nuget.org → Account → Trusted publishing → Add policy:
#      owner "bluesmilecl", repository "sdk-agent-ia-net", workflow file "release.yml", environment "release".
#   2. GitHub → Settings → Environments → "release" con el secreto NUGET_USER (nombre de perfil de nuget.org, no el correo).
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # necesario para el token OIDC de NuGet/login
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Herramientas para las pruebas de documentos
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa poppler-utils ffmpeg
      - name: Versión desde el tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build AiSdk.slnx -c Release /p:Version=$VERSION
      - run: dotnet test tests/AiSdk.Tests --no-build -c Release
      - name: Empaquetar (solo los proyectos de src/ son empaquetables)
        run: dotnet pack AiSdk.slnx -c Release --no-build -o artifacts /p:Version=$VERSION
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publicar en nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
