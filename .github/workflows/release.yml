name: Release

# Publishes to nuget.org when a vX.Y.Z tag is pushed (e.g. v0.2.0) using trusted publishing (OIDC):
# there are no long-lived API keys; NuGet/login gets a temporary token for this workflow.
#
# One-time setup (see docs/quality/nuget-trusted-publishing.md):
#   1. nuget.org → Account → Trusted publishing → Add policy:
#      owner "bluesmilecl", repository "sdk-agent-ia-net", workflow file "release.yml", environment "release".
#   2. GitHub → Settings → Environments → "release" with the NUGET_USER secret (nuget.org profile name, not the email).
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # required for the NuGet/login OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Tools for the document tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa poppler-utils ffmpeg
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build AiSdk.slnx -c Release /p:Version=$VERSION
      - run: dotnet test tests/AiSdk.Tests --no-build -c Release
      - name: Pack (only the src/ projects are packable)
        run: dotnet pack AiSdk.slnx -c Release --no-build -o artifacts /p:Version=$VERSION
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
