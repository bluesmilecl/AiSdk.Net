name: Release

# Publishes to nuget.org when a vX.Y.Z tag is pushed (e.g. v0.2.0) using trusted publishing (OIDC):
# there are no long-lived API keys; NuGet/login gets a temporary token for this workflow.
#
# One-time setup (see docs/quality/nuget-trusted-publishing.md):
#   1. nuget.org → Account → Trusted publishing → Add policy:
#      owner "bluesmilecl", repository "AiSdk.Net", workflow file "release.yml", environment "release".
#   2. GitHub → Settings → Environments → "release" with the NUGET_USER secret (nuget.org profile name, not the email).
#
# Two jobs: "build" compiles, tests and packs with a read-only token (tests and restore run third-party code);
# only "publish", behind the "release" environment, can mint OIDC tokens, attest provenance and push.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Tools for the document tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa poppler-utils ffmpeg
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # NU1903/NU1904 (dependencias con vulnerabilidades altas o críticas) son errores: no se publica con ellas.
      - run: dotnet build AiSdk.slnx -c Release /p:Version=$VERSION
      - run: dotnet test tests/AiSdk.Tests --no-build -c Release
      - name: Pack (only the src/ projects are packable)
        run: dotnet pack AiSdk.slnx -c Release --no-build -o artifacts /p:Version=$VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write          # NuGet/login (OIDC) y firma de la atestación
      attestations: write      # atestación de procedencia (SLSA) de los .nupkg
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages
          path: artifacts
      - name: Provenance attestation (verify with `gh attestation verify <file>.nupkg -R bluesmilecl/AiSdk.Net`)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'artifacts/*.nupkg'
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
