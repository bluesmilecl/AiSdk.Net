name: Release

# Publica en nuget.org al crear un tag vX.Y.Z (p. ej. v0.2.0).
# Requiere el secreto NUGET_API_KEY en el repositorio.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Versión desde el tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build -c Release /p:Version=$VERSION
      - run: dotnet test tests/AiSdk.Tests --no-build -c Release
      - run: dotnet pack src -c Release --no-build -o artifacts /p:Version=$VERSION
      - name: Publicar en nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
